name: Update 13F Data

on:
  schedule:
    - cron: '0 12 10-20 2,5,8,11 *'
    - cron: '0 12 1 1,3,4,6,7,9,10,12 *'
  workflow_dispatch:
    inputs:
      backfill_history:
        description: Refresh full Stanley history (may report unresolved amendments)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SEC adapter
        run: pip install -r scripts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/sec
          key: sec-filings-${{ github.run_id }}
          restore-keys: sec-filings-
      - name: Test SEC reconciliation
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Fetch latest complete 13F data
        id: fetch
        continue-on-error: true
        run: python scripts/import_openbb.py --output src/data.json --quarters 4
      - name: Refresh Stanley history
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_history
        id: history
        continue-on-error: true
        run: python scripts/import_openbb.py --output src/data.json --funds duquesne --quarters 60
      - name: Validate snapshots
        run: python scripts/validate_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install analysis dependencies
        run: npm ci
      - name: Verify updated reports before committing data
        run: |
          npm test
          npm run lint
          npm run build
      - name: Check for changes
        id: check
        run: |
          git diff --quiet src/data.json && echo "has_changes=false" >> $GITHUB_OUTPUT || echo "has_changes=true" >> $GITHUB_OUTPUT
      - name: Commit and push
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(python -c "import json; print(json.load(open('src/data.json'))['generated'])")
          git add src/data.json
          git commit -m "data: update 13F holdings ($DATE)"
          git push

      - name: Report incomplete refresh
        if: steps.fetch.outcome == 'failure' || steps.history.outcome == 'failure'
        run: |
          echo "Some filings could not be reconciled. Successful periods were saved; previous snapshots retained."
          exit 1
